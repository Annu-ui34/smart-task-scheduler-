<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Tasks</title>

</head>

<body>

<h2>Tasks</h2>

<a th:href="@{/tasks/new}">

Add Task

</a>

<hr>

<table border="1">

<tr>

<th>ID</th>

<th>Title</th>

<th>Status</th>

<th>Priority</th>

<th>Action</th>

</tr>

<tr th:each="task : ${tasks}">

<td th:text="${task.id}"></td>

<td th:text="${task.title}"></td>

<td th:text="${task.status}"></td>

<td th:text="${task.priority}"></td>

<td>

<a th:href="@{'/tasks/delete/' + ${task.id}}">

Delete

</a>

</td>

</tr>

</table>

</body>
</html>
