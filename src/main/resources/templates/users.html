<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Users</title>
</head>

<body>

<h2>Users</h2>

<a th:href="@{/users/new}">Add User</a>

<hr>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Action</th>
</tr>

<tr th:each="user : ${users}">

    <td th:text="${user.id}"></td>

    <td th:text="${user.name}"></td>

    <td th:text="${user.email}"></td>

    <td>

        <a th:href="@{'/users/delete/' + ${user.id}}">
            Delete
        </a>

    </td>

</tr>

</table>

</body>
</html>
